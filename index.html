<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagedown | Turn any web page into clean Markdown</title>
    <meta name="description" content="Fetches any public web page and returns its main article as clean Markdown, with navigation, ads, and page chrome stripped and source links kept." />
    <link rel="canonical" href="https://pagedown.bryancalabro.com/" />
    <meta name="theme-color" content="#171C2B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Bryan J. Calabro" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicons/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/favicons/favicon-180.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pagedown" />
    <meta property="og:title" content="Pagedown | Turn any web page into clean Markdown" />
    <meta property="og:description" content="Fetches any public web page and returns its main article as clean Markdown, with navigation, ads, and page chrome stripped and source links kept." />
    <meta property="og:url" content="https://pagedown.bryancalabro.com/" />
    <meta property="og:image" content="https://pagedown.bryancalabro.com/favicons/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A browser window with a web page and an arrow to a Markdown document" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pagedown | Turn any web page into clean Markdown" />
    <meta name="twitter:description" content="Fetches any public web page and returns its main article as clean Markdown, with navigation, ads, and page chrome stripped and source links kept." />
    <meta name="twitter:image" content="https://pagedown.bryancalabro.com/favicons/og-image.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pagedown",
        "url": "https://pagedown.bryancalabro.com/",
        "description": "Fetches any public web page and returns its main article as clean Markdown, with navigation, ads, and page chrome stripped and source links kept.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Bryan J. Calabro", "url": "https://bryancalabro.com" }
      }
    </script>
    <script>(function(){try{var s=JSON.parse(localStorage.getItem("bc:pagedown.bryancalabro.com")||"null");var t=s&&s.theme;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  </head>
  <body>
    <div id="root">
      <h1 class="sr-only">Pagedown</h1>
      <noscript>Pagedown needs JavaScript to fetch a page and write it out as Markdown. Turn it on and reload the page.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
